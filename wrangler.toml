name = "bolek-workspace"
compatibility_date = "2026-08-10"
pages_build_output_dir = "./dist"

# Cloudflare Pages Functions live in the root /functions folder.
# Replace the D1 database_id with your production database UUID before deployment.

[[d1_databases]]
binding = "DB"
database_name = "bolek_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Cloudflare R2 Storage Bucket Binding (For images and sticky note attachments)
[[r2_buckets]]
binding = "STICKY_BUCKET"
bucket_name = "bolek-sticky-files"

[vars]
ENVIRONMENT = "production"
